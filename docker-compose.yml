# Household Ledger — run from the published image. Copy .env.example to .env first.
# Upgrades: `docker compose pull && docker compose up -d` (or let Watchtower/your updater do it): pending migrations apply themselves on start.
services:
  ledger:
    image: ghcr.io/jkbeeman92/household-ledger:latest
    container_name: ledger
    restart: unless-stopped
    env_file: .env
    # Hardening: the app writes only to the temp dir (rebuild working folder, upload spool), so everything else is read-only.
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgresql://ledger:${POSTGRES_PASSWORD}@ledger-db:5432/ledger
      BRAND_DIR: /data/brand
      SEED_DIR: /data/seed
      IMPORT_DIR: /data/import
    ports:
      - "8010:8010"
    volumes:
      - ${LEDGER_DATA:-./data}/brand:/data/brand:ro   # optional: theme.css, mark.svg, images, custom.css
      - ${LEDGER_DATA:-./data}/import:/data/import:ro # optional: drop EveryDollar exports here; new/changed files load on every start
      - ${LEDGER_DATA:-./data}/seed:/data/seed:ro     # optional, first boot only: item_mapping.csv, goals.json, events.json, rules.json, review.json, household.json
    depends_on:
      ledger-db:
        condition: service_healthy

  ledger-db:
    image: postgres:16-alpine
    container_name: ledger-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${LEDGER_DATA:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional nightly dump of the database: `docker compose --profile backup up -d`. Not started by a plain `up`.
  # Writes ${LEDGER_DATA}/backups/ledger-<UTC time>.dump (pg_dump custom format) and deletes dumps older than BACKUP_KEEP_DAYS.
  backup:
    image: postgres:16-alpine
    container_name: ledger-backup
    profiles: ["backup"]
    restart: unless-stopped
    environment:
      PGHOST: ledger-db
      PGUSER: ledger
      PGDATABASE: ledger
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - ${LEDGER_DATA:-./data}/backups:/backups
    depends_on:
      ledger-db:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        umask 077
        while true; do
          f=/backups/ledger-$$(date -u +%Y%m%dT%H%M%SZ).dump
          if pg_dump -Fc -f "$$f.tmp"; then mv "$$f.tmp" "$$f"; echo "backup written: $$f"
          else echo "backup FAILED" >&2; fi
          find /backups -name 'ledger-*.dump*' -mtime "+$$BACKUP_KEEP_DAYS" -delete
          [ -n "$$BACKUP_ONCE" ] && exit 0
          sleep "$$((BACKUP_INTERVAL_HOURS * 3600))"
        done
