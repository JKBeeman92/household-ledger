<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · {{ household.title }}</title>
<link rel="icon" href="/brand/mark-small.svg"><link rel="stylesheet" href="/brand/theme.css"><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/brand/custom.css">
<script nonce="{{ csp_nonce(request) }}">try { const t = localStorage.getItem('theme'); if (t === 'light' || (!t && matchMedia('(prefers-color-scheme: light)').matches)) document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}</script></head>
<body><div class="login"><div class="sheet-stack"><div class="card"><img class="mark-day" src="/brand/mark.svg" alt=""><img class="mark-night" src="/brand/mark-dark.svg" alt=""><h1>{{ words.name }}</h1>
<p class="tagline">{{ words.tagline }}</p>
<p class="muted">{{ household.name }}. {{ words.login_line }}</p>
{% if signed_out %}<p class="flash ok">You are signed out.</p>{% endif %}
{% if error %}<p class="flash bad">{{ error }}</p>{% endif %}
<p><a class="btn primary" href="/auth/start?next={{ next|urlencode }}">Sign in</a></p></div></div></div></body></html>
