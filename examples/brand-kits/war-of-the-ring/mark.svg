<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="War of the Ring">
  <!-- the Ring, which both sides contend for: plain gold on a dark disc, so it reads on light and dark surfaces alike -->
  <defs>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset=".55" stop-color="#f07a2e" stop-opacity=".35"/><stop offset="1" stop-color="#f07a2e" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe59a"/><stop offset=".45" stop-color="#e2b34a"/><stop offset="1" stop-color="#9c6b14"/></linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="#14100d"/>
  <circle cx="32" cy="32" r="28" fill="url(#glow)"/>
  <ellipse cx="32" cy="33" rx="15.5" ry="13" fill="none" stroke="url(#gold)" stroke-width="6"/>
  <ellipse cx="32" cy="33" rx="15.5" ry="13" fill="none" stroke="#fff3c4" stroke-width="1" stroke-opacity=".6" stroke-dasharray="7 30" stroke-dashoffset="-4"/>
</svg>
