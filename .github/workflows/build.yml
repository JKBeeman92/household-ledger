# One workflow, three jobs:
#   test    — pytest against a postgres:16 service container (pipeline goldens, route smoke tests); the image job needs it.
#   release — release-please reads Conventional Commits on main, keeps a "chore(main): release x.y.z" PR open with the
#             CHANGELOG, and when that PR is merged creates the vX.Y.Z tag and GitHub Release.
#   image   — builds the container for linux/amd64 and linux/arm64 on every push to main (tag `latest` + short sha) and, when a
#             release was just cut, also tags it with the semver (x.y.z, x.y, x). Only this job and `release` hold write permissions.
#   image-check — pull requests only: builds the amd64 image into the runner's Docker (no push; a multi-platform build cannot be
#             loaded) and fails on fixable HIGH/CRITICAL vulnerabilities found by Trivy. Read-only token.
# Third-party actions are pinned to a commit SHA with the version in a trailing comment; Dependabot bumps both together.
name: build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  release:
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledger -d ledger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ledger:ledger@localhost:5432/ledger_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # The backup test dumps and restores with the tools of the server's own major (postgres:16 above). The runner image ships a
      # newer client, whose pg_restore sends settings a 16 server refuses, so install the matching one from the PostgreSQL project's
      # own apt repository (the distribution's carries only its current major).
      - name: Install the Postgres 16 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $VERSION_CODENAME-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg-16.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
      - run: python -m pytest -q

  image:
    needs: [release, test]
    # Push to main only (the release job is skipped on pull requests). always() lifts the implicit "all needs succeeded"
    # rule, so a failed or cancelled test must be checked explicitly.
    if: always() && github.event_name == 'push' && needs.test.result == 'success' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/bearings
          tags: |
            type=raw,value=latest
            type=sha
            type=raw,value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.released == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }},enable=${{ needs.release.outputs.released == 'true' }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.tag }},enable=${{ needs.release.outputs.released == 'true' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image-check:
    needs: [test]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          platforms: linux/amd64   # single platform: `load` needs one image in the local Docker daemon
          load: true   # Trivy scans the image from the local Docker daemon
          tags: bearings:pr-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bearings:pr-scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true   # only what an upgrade can fix; keeps the check actionable
          exit-code: "1"
